# /etc/nginx/sites-available/heritage
# 前端静态文件由 Nginx 直出，/api 与 /admin 反代到 Gunicorn

server {
    listen 80;
    server_name _;

    # 头像等上传文件走这里，别让 Gunicorn 扛
    client_max_body_size 20m;

    # 后端接口
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # AI 对话是流式返回，必须关掉缓冲，否则前端要等全部生成完才看到字
    location /api/ai/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # Django Admin
    location /admin/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # collectstatic 的产物（^~ 防止被下面的正则 location 抢走）
    location ^~ /static/ {
        alias /var/www/heritage/hesitage-backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # 上传的头像等媒体文件（同样用 ^~ 挡住正则）
    location ^~ /media/ {
        alias /var/www/heritage/hesitage-backend/media/;
        expires 7d;
    }

    # Vue 构建产物（history 模式需要回落到 index.html）
    location / {
        root  /var/www/heritage/heritage-tourism/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 视频与全景图较大，单独放开缓存
    location ~* \.(mp4|png|jpe?g|webp|mp3)$ {
        root      /var/www/heritage/heritage-tourism/dist;
        expires   7d;
        access_log off;
    }
}
